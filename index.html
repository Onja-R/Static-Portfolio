<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Consultant SAP BW/4HANA</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>

    <div id="root"></div>

                            <a href="index.html" className="logo">SAP.EXPERT</a>

                                <li><a href="projets.html">Projets</a></li>
                                <li><a href="competences.html">Compétences</a></li>
                                <li><a href="contact.html">Contact</a></li>
                            </ul>
                            <button className="theme-toggle" onClick={toggleTheme}>
                                {theme === 'dark' ? '☀️' : '🌙'} Mode
                            </button>
                        </div>
                    </nav>

                    <section className="hero" id="accueil">
                        <div className="hero-content">
                            <div className="hero-badge">🚀 Disponible pour nouvelles missions</div>

                            </p>
                            <div className="cta-buttons">
                                <a href="projets.html" className="btn btn-primary">Voir mes projets →</a>
                                <a href="contact.html" className="btn btn-secondary">Me contacter</a>
                            </div>
                        </div>
                    </section>

                    <section className="cards-section">
                        <div className="cards-grid">
                            <div className="card">
                                <div className="card-icon">📊</div>
                                <h3>Projets</h3>
                                <p>Découvrez mes missions SAP et réalisations en BW/4HANA, S/4HANA et solutions analytiques.</p>
                                <a href="projets.html" className="card-link">Explorer →</a>
                            </div>

                            <div className="card">
                                <div className="card-icon">⚡</div>
                                <h3>Compétences</h3>
                                <p>Technologies SAP, méthodologies et expertises techniques en data warehousing et BI.</p>
                                <a href="competences.html" className="card-link">Découvrir →</a>
                            </div>

                                <a href="contact.html" className="card-link">Échanger →</a>

                    </section>

                    <section className="stats-section">
                        <div className="stats-grid">
                            <div className="stat"><div className="stat-number">8+</div><div className="stat-label">Années d'expérience</div></div>
                            <div className="stat"><div className="stat-number">25+</div><div className="stat-label">Projets réalisés</div></div>
                            <div className="stat"><div className="stat-number">15+</div><div className="stat-label">Clients satisfaits</div></div>
                            <div className="stat"><div className="stat-number">100%</div><div className="stat-label">Missions réussies</div></div>
                        </div>

        ReactDOM.render(<App />, document.getElementById('root'));
