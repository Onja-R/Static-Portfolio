<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Consultant SAP BW/4HANA</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function ContactPage() {
            // --- Logique du thème (ajoutée) ---
            const [theme, setTheme] = useState('dark');
            const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');

            // --- Logique du formulaire (conservée) ---
            const [formData, setFormData] = useState({
                name: '', email: '', phone: '', subject: '', projectType: '', message: ''
            });
            const [status, setStatus] = useState({ type: '', message: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
            /*
            document.getElementById("year").textContent = new Date().getFullYear();
            */

            const currentYear = new Date().getFullYear();

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setStatus({ type: '', message: '' });

                try {
                    const response = await fetch('https://formspree.io/f/maqdqewb', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    if (response.ok) {
                        setStatus({ type: 'success', message: '✓ Message envoyé avec succès !' });
                        setFormData({ name: '', email: '', phone: '', subject: '', projectType: '', message: '' });
                    } else { throw new Error('Erreur'); }
                } catch (error) {
                    setStatus({ type: 'error', message: '✕ Une erreur est survenue.' });
                }
                setIsSubmitting(false);
            };

            return (
                <>
                    <nav>
                        <div className="nav-container">
                            <a href="index.html" className="logo">SAP.EXPERT</a>
                            <ul className="nav-links">
                                <li><a href="index.html">Accueil</a></li>
                                <li><a href="projets.html">Projets</a></li>
                                <li><a href="competences.html">Compétences</a></li>
                                <li><a href="contact.html" className="active">Contact</a></li>
                            </ul>
                            {/* Bouton ajouté pour uniformité */}
                            <button className="theme-toggle" onClick={toggleTheme}>
                                {theme === 'dark' ? '☀️' : '🌙'} Mode
                            </button>
                        </div>
                    </nav>

                    <main>
                        <div className="contact-container">
                            <div className="contact-header">
                                <div className="contact-badge">Discutons de votre projet</div>
                                <h1>Travaillons ensemble</h1>
                                <p>Vous avez un projet SAP ou besoin d'expertise en BW/4HANA ? Je suis à votre écoute pour en discuter.</p>
                            </div>

                            <div className="contact-content">
                                <div className="contact-info">
                                    <div className="info-card">
                                        <div className="info-card-header"><div className="info-icon">📧</div><h3>Email</h3></div>
                                        <p><a href="mailto:contact@example.com">contact@example.com</a></p>
                                    </div>
                                    <div className="info-card">
                                        <div className="info-card-header"><div className="info-icon">📱</div><h3>Téléphone</h3></div>
                                        <p><a href="tel:+33600000000">+33 6 00 00 00 00</a></p>
                                    </div>
                                    <div className="info-card">
                                        <div className="info-card-header"><div className="info-icon">📍</div><h3>Localisation</h3></div>
                                        <p>Paris, France<br/>Interventions partout en France et à distance</p>
                                    </div>
                                    <div className="availability-badge">
                                        <span className="status-dot"></span> Disponible pour nouvelles missions
                                    </div>
                                </div>

                                <div className="contact-form">
                                    {status.message && <div className={`message ${status.type}`}>{status.message}</div>}
                                    <form onSubmit={handleSubmit}>
                                        <div className="form-row">
                                            <div className="form-group">
                                                <label>Nom complet *</label>
                                                <input type="text" name="name" value={formData.name} onChange={handleChange} required placeholder="Jean Dupont" />
                                            </div>
                                            <div className="form-group">
                                                <label>Email *</label>
                                                <input type="email" name="email" value={formData.email} onChange={handleChange} required placeholder="jean.dupont@entreprise.com" />
                                            </div>
                                        </div>
                                        <div className="form-row">
                                            <div className="form-group">
                                                <label>Téléphone</label>
                                                <input type="tel" name="phone" value={formData.phone} onChange={handleChange} placeholder="+33 6 00 00 00 00" />
                                            </div>
                                            <div className="form-group">
                                                <label>Type de projet *</label>
                                                <select name="projectType" value={formData.projectType} onChange={handleChange} required>
                                                    <option value="">Sélectionner</option>
                                                    <option value="bw4hana">Migration BW/4HANA</option>
                                                    <option value="s4hana">Projet S/4HANA</option>
                                                    <option value="analytics">Analytics & BI</option>
                                                    <option value="optimization">Optimisation</option>
                                                    <option value="consulting">Conseil</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label>Sujet *</label>
                                            <input type="text" name="subject" value={formData.subject} onChange={handleChange} required placeholder="Migration SAP BW vers BW/4HANA" />
                                        </div>
                                        <div className="form-group">
                                            <label>Message *</label>
                                            <textarea name="message" value={formData.message} onChange={handleChange} required placeholder="Décrivez votre projet..."></textarea>
                                        </div>
                                        <button type="submit" className="btn-submit" disabled={isSubmitting}>
                                            {isSubmitting ? 'Envoi...' : 'Envoyer le message →'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer>
                        <p>&copy; {currentYear} - Tous droits réservés</p>
                    </footer>
                </>
            );
        }

        ReactDOM.render(<ContactPage />, document.getElementById('root'));
    </script>
</body>
</html>
