<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Consultant SAP BW/4HANA</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1420;
            --bg-glass: rgba(15, 20, 32, 0.6);
            --text-primary: #e8edf4;
            --text-secondary: #8b95a8;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --grid-color: rgba(0, 212, 255, 0.05);
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent), transparent);
            top: -200px;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #4a9eff, transparent);
            bottom: -150px;
            left: -100px;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }

        #root {
            position: relative;
            z-index: 1;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 3rem;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a.active {
            color: var(--accent);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* Main Content */
        main {
            min-height: 100vh;
            padding: 8rem 3rem 4rem;
        }

        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .contact-header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .contact-header p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
            align-items: start;
        }

        /* Contact Info */
        .contact-info {
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .info-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            border-color: var(--accent);
            transform: translateX(10px);
        }

        .info-card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .info-card h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .info-card p {
            color: var(--text-secondary);
            margin-left: 66px;
            line-height: 1.6;
        }

        .info-card a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .info-card a:hover {
            opacity: 0.8;
        }

        .availability-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: var(--success);
            font-weight: 600;
            margin-top: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Contact Form */
        .contact-form {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 3rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1.25rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px var(--accent-glow);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Success/Error Messages */
        .message {
            padding: 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2rem 3rem;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .contact-content {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-links {
                display: none;
            }

            main {
                padding: 6rem 1.5rem 3rem;
            }

            .contact-form {
                padding: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            footer {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function ContactPage() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                phone: '',
                subject: '',
                projectType: '',
                message: ''
            });
            const [status, setStatus] = useState({ type: '', message: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setStatus({ type: '', message: '' });

                try {
                    const response = await fetch('https://formspree.io/f/maqdqewb', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        setStatus({
                            type: 'success',
                            message: '✓ Message envoyé avec succès ! Je vous répondrai dans les plus brefs délais.'
                        });
                        setFormData({
                            name: '',
                            email: '',
                            phone: '',
                            subject: '',
                            projectType: '',
                            message: ''
                        });
                    } else {
                        throw new Error('Erreur lors de l\'envoi');
                    }
                } catch (error) {
                    setStatus({
                        type: 'error',
                        message: '✕ Une erreur est survenue. Veuillez réessayer ou me contacter directement par email.'
                    });
                }

                setIsSubmitting(false);
            };

            return (
                <>
                    <nav>
                        <div className="nav-container">
                            <a href="index.html" className="logo">SAP.EXPERT</a>
                            <ul className="nav-links">
                                <li><a href="index.html">Accueil</a></li>
                                <li><a href="projets.html">Projets</a></li>
                                <li><a href="competences.html">Compétences</a></li>
                                <li><a href="contact.html" className="active">Contact</a></li>
                            </ul>
                        </div>
                    </nav>

                    <main>
                        <div className="contact-container">
                            <div className="contact-header">
                                <div className="contact-badge">💬 Discutons de votre projet</div>
                                <h1>Travaillons ensemble</h1>
                                <p>
                                    Vous avez un projet SAP ou besoin d'expertise en BW/4HANA ? 
                                    Je suis à votre écoute pour en discuter.
                                </p>
                            </div>

                            <div className="contact-content">
                                <div className="contact-info">
                                    <div className="info-card">
                                        <div className="info-card-header">
                                            <div className="info-icon">📧</div>
                                            <h3>Email</h3>
                                        </div>
                                        <p>
                                            <a href="mailto:contact@example.com">contact@example.com</a>
                                        </p>
                                    </div>

                                    <div className="info-card">
                                        <div className="info-card-header">
                                            <div className="info-icon">📱</div>
                                            <h3>Téléphone</h3>
                                        </div>
                                        <p>
                                            <a href="tel:+33600000000">+33 6 00 00 00 00</a>
                                        </p>
                                    </div>

                                    <div className="info-card">
                                        <div className="info-card-header">
                                            <div className="info-icon">📍</div>
                                            <h3>Localisation</h3>
                                        </div>
                                        <p>Paris, France<br/>Interventions partout en France et à distance</p>
                                    </div>

                                    <div className="info-card">
                                        <div className="info-card-header">
                                            <div className="info-icon">💼</div>
                                            <h3>LinkedIn</h3>
                                        </div>
                                        <p>
                                            <a href="https://linkedin.com/in/votre-profil" target="_blank" rel="noopener noreferrer">
                                                linkedin.com/in/votre-profil
                                            </a>
                                        </p>
                                    </div>

                                    <div className="availability-badge">
                                        <span className="status-dot"></span>
                                        Disponible pour nouvelles missions
                                    </div>
                                </div>

                                <div className="contact-form">
                                    {status.message && (
                                        <div className={`message ${status.type}`}>
                                            {status.message}
                                        </div>
                                    )}

                                    <form onSubmit={handleSubmit}>
                                        <div className="form-row">
                                            <div className="form-group">
                                                <label htmlFor="name">Nom complet *</label>
                                                <input
                                                    type="text"
                                                    id="name"
                                                    name="name"
                                                    value={formData.name}
                                                    onChange={handleChange}
                                                    required
                                                    placeholder="Jean Dupont"
                                                />
                                            </div>

                                            <div className="form-group">
                                                <label htmlFor="email">Email *</label>
                                                <input
                                                    type="email"
                                                    id="email"
                                                    name="email"
                                                    value={formData.email}
                                                    onChange={handleChange}
                                                    required
                                                    placeholder="jean.dupont@entreprise.com"
                                                />
                                            </div>
                                        </div>

                                        <div className="form-row">
                                            <div className="form-group">
                                                <label htmlFor="phone">Téléphone</label>
                                                <input
                                                    type="tel"
                                                    id="phone"
                                                    name="phone"
                                                    value={formData.phone}
                                                    onChange={handleChange}
                                                    placeholder="+33 6 00 00 00 00"
                                                />
                                            </div>

                                            <div className="form-group">
                                                <label htmlFor="projectType">Type de projet *</label>
                                                <select
                                                    id="projectType"
                                                    name="projectType"
                                                    value={formData.projectType}
                                                    onChange={handleChange}
                                                    required
                                                >
                                                    <option value="">Sélectionner</option>
                                                    <option value="bw4hana">Migration BW/4HANA</option>
                                                    <option value="s4hana">Projet S/4HANA</option>
                                                    <option value="analytics">Analytics & BI</option>
                                                    <option value="optimization">Optimisation</option>
                                                    <option value="consulting">Conseil</option>
                                                    <option value="autre">Autre</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="form-group">
                                            <label htmlFor="subject">Sujet *</label>
                                            <input
                                                type="text"
                                                id="subject"
                                                name="subject"
                                                value={formData.subject}
                                                onChange={handleChange}
                                                required
                                                placeholder="Migration SAP BW vers BW/4HANA"
                                            />
                                        </div>

                                        <div className="form-group">
                                            <label htmlFor="message">Message *</label>
                                            <textarea
                                                id="message"
                                                name="message"
                                                value={formData.message}
                                                onChange={handleChange}
                                                required
                                                placeholder="Décrivez votre projet, vos besoins et vos objectifs..."
                                            ></textarea>
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="btn-submit"
                                            disabled={isSubmitting}
                                        >
                                            {isSubmitting ? 'Envoi en cours...' : 'Envoyer le message →'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer>
                        <p>&copy; 2025 - Tous droits réservés</p>
                    </footer>
                </>
            );
        }

        ReactDOM.render(<ContactPage />, document.getElementById('root'));
    </script>
</body>
</html>
